<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Trade [1,2,3,0,2] with a 1-day cooldown after each sell. Best: buy 1, sell 3, cool,</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">buy 0, sell 2 → profit 3. Track three states: HOLDING, just SOLD, RESTING.</text>
