<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Daily transitions (from YESTERDAY's values): hold = max(hold, rest − price) — buying</text>
