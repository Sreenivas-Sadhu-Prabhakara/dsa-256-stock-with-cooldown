<text x="56.0" y="480.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Final best: max(sold 3, rest 2) = 3. The key cell: on day 4 (price 0), hold jumps to</text>
